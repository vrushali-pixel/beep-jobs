# Company job boards to read. Every source here is the company's OWN official job board,
# exposed through the board provider's public postings API (built for showing jobs publicly).
#
# Boards that did not exist were removed on 17 Nov 2026 (see BUILD_LOG #13).
# `fresherjobs discover` checks every board and prints how many India entry-level posts each has.
#
# To add a company: find its careers page, look at the link
#   job-boards.greenhouse.io/<slug>   -> greenhouse
#   jobs.lever.co/<slug>              -> lever
#   jobs.ashbyhq.com/<slug>           -> ashby
#   jobs.smartrecruiters.com/<Slug>   -> smartrecruiters
#   apply.workable.com/<slug>         -> workable
#   <slug>.recruitee.com              -> recruitee
#   <slug>.breezy.hr                  -> breezy
#   <tenant>.keka.com/careers         -> keka
# and add <slug> below.

