name: Daily job refresh

on:
  schedule:
    - cron: "40 0 * * *"      # 00:40 UTC = 6:10 AM IST, every day
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write             # save today's data back to the repo
  pages: write
  id-token: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, filter, de-dupe, tag, publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.run

      - name: Save data to the repo
        run: |
          git config user.name "daily-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/jobs.json
          git commit -m "Daily refresh $(TZ=Asia/Kolkata date +%F)" || echo "nothing changed"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
