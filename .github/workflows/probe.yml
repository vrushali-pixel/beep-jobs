name: Probe new boards (temporary)
on:
  push:
    branches: [probe-new-boards]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q .
      - name: Rentokil locations
        shell: python
        run: |
          import collections, json, urllib.request
          from fresherjobs.sources import workable
          from fresherjobs.config import Paths, load_settings
          from fresherjobs.filters import Rules
          rules = Rules(load_settings(Paths()))
          posts = workable.fetch("rentokil-initial")
          bad = [p for p in posts if rules.check(p) == "not in India"]
          print("LOC", collections.Counter(p["location"] for p in bad).most_common(15))
          raw = json.load(urllib.request.urlopen(urllib.request.Request("https://apply.workable.com/api/v1/widget/accounts/rentokil-initial", headers={"User-Agent": "fresherjobs/1.0"})))
          print("RAWC", collections.Counter(j.get("country") for j in raw["jobs"]).most_common(8))
