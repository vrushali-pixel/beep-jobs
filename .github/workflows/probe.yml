name: Probe new boards (temporary)
on:
  push:
    branches: [probe-new-boards]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: python
        run: |
          import json, re, urllib.request
          UA = {"User-Agent": "fresherjobs/1.0 (student job finder; see github.com/vrushali-pixel/beep-jobs)"}
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=20) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", 0), str(e)
          first = True
          for t in "kognitokube coolboots comprinno gokwik teachmint tohands minfy adda247 popclub kitemaps earthitects lambdatest keka".split():
              s, html = get(f"https://{t}.keka.com/careers/")
              ids = re.findall(r"/ats/documents/([0-9a-f-]{36})/careerportal", html)
              if not ids:
                  print("KEKA", t, s, "no id"); continue
              s2, b = get(f"https://{t}.keka.com/careers/api/embedjobs/default/active/{ids[0]}")
              try:
                  jobs = json.loads(b)
              except Exception:
                  print("KEKA", t, s2, b[:100]); continue
              if first and jobs:
                  j = dict(jobs[0]); j["description"] = j.get("description", "")[:80]
                  print("KEKA-SAMPLE", json.dumps(j)[:2500]); first = False
              print("KEKA", t, ids[0], len(jobs), [x.get("title") for x in jobs][:10])
          for w in "rentokil-initial appfoster".split():
              s, b = get(f"https://apply.workable.com/api/v1/widget/accounts/{w}")
              try:
                  jobs = json.loads(b)["jobs"]; print("WORKABLE", w, len(jobs), [j["title"] for j in jobs if j.get("country") == "India"][:10])
              except Exception: print("WORKABLE", w, s, b[:80])
