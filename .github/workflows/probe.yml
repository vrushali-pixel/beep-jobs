name: Probe new boards (temporary)
on:
  push:
    branches: [probe-new-boards]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q .
      - name: Full pipeline dry run (nothing is committed or published)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          fresherjobs run 2>&1 | tail -40
          echo "STATS $(tail -1 data/runs.jsonl)"
          python -c "import json,collections;d=json.load(open('site/jobs.json'));print('LIVE',len(d['jobs']),collections.Counter(j['source'] for j in d['jobs']))"
