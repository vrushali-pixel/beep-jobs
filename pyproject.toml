[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fresherjobs"
version = "1.0.0"
description = "A daily, LLM-tagged feed of real internship and fresher job posts in India from official company job boards."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vrushali Patil" }]
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fresherjobs = "fresherjobs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["fresherjobs", "conftest"]
