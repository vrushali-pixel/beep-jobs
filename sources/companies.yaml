# Workday career sites are big MNC boards. Their search endpoint is the one the public
# careers page itself calls, but it is NOT a documented public API, so it is OFF by default.
# Decide before turning it on (see README: "Respecting site terms").
workday_enabled: false
workday:
  - {company: LSEG,           host: lseg.wd3.myworkdayjobs.com,               tenant: lseg,           site: Careers}
